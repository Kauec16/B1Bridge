name: CI

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore B1Bridge.slnx

      - name: Build
        run: dotnet build B1Bridge.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test B1Bridge.slnx --configuration Release --no-build --verbosity normal
